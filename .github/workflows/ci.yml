# SPDX-License-Identifier: AGPL-3.0-only
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Cosmetic quality gate. Runs in parallel with `build` but does NOT block
  # the deploy — per project policy, formatter/lint failures should never
  # hold up a release. Fix them in a follow-up commit.
  style:
    name: Style (lint + format)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build libs so type-aware lint resolves workspace imports
        run: pnpm build:libs
      - name: Format check
        run: pnpm format:check
      - name: Lint
        run: pnpm lint

  # Correctness gate. Required for deploy. Builds libs so both tsc --noEmit
  # and the Vite bundle can resolve workspace types; runs vitest; finishes
  # with the production app build that the deploy job publishes.
  build:
    name: Build, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build libs
        run: pnpm build:libs

      - name: Typecheck
        run: pnpm --filter @roller-coaster-designer/app typecheck

      - name: Test
        run: pnpm test

      - name: Build app
        env:
          # GitHub Pages serves the project at /<repo-name>/, so bake the
          # base path at build time.
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: pnpm build:app

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: packages/app/dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
